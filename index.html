<div class="app">
  <main class="stage">
    <section class="top" aria-label="乐器设置">
      <div class="segmented" id="tunings" aria-label="调式"><button class="selected" data-tuning="D" aria-pressed="true">D 调</button><button data-tuning="C" aria-pressed="false">C 调</button></div>
      <div class="quick">

        <div class="finish"><button id="colorTrigger" class="color-trigger" aria-expanded="false"><span id="colorDot" class="color-dot"></span>鼓色</button>
          <div id="colorPanel" class="color-panel hidden" aria-label="选择鼓面颜色"><div id="presets" class="presets"></div><label class="custom-color"><span>自选颜色</span><input id="colorInput" aria-label="自定义鼓面颜色" type="color" value="#3d4748"></label></div>
        </div>
      </div>
    </section>
    <section id="intro" class="intro"><p>戴上耳机，轻触音舌</p><strong id="tuningLabel">D 调 · 15 音</strong></section>
    <section id="practice" class="practice hidden" aria-label="跟谱练习">
      <div class="practice-head"><label><span class="label">练习谱</span><select id="scoreSelect" aria-label="选择练习谱"></select></label><button id="demo" class="demo">播放示范</button></div>
      <p id="scoreDetail" class="score-detail"></p><div id="scoreLine" class="score-line"></div>
      <div class="tempo"><div class="tempo-head"><span>播放速度</span><strong id="tempoLabel"></strong></div><div id="tempoSteps" class="tempo-steps"></div></div>
      <div class="practice-meta"><span id="progress"></span><span id="defaultTempo"></span><button id="restart">重来</button></div>
    </section>
    <section id="record" class="record hidden" aria-label="录音控制"><div><span id="recordDot" class="record-dot"></span><strong id="recordState">准备录音</strong><span id="timer" class="timer">00:00</span></div><button id="recordBtn" class="record-btn">开始录音</button></section>
    <section class="instrument" aria-label="十五音空灵鼓"><div id="drum" class="drum"><div class="metal-ring"></div><div id="mark" class="mark">D</div></div><p id="audioError" class="error hidden"></p><p id="coach" class="coach hidden">跟着亮起的音舌敲，敲对后自动前进</p></section>
    <section id="take" class="take hidden" aria-label="本次录音"><audio id="player" controls aria-label="播放本次录音"></audio><a id="saveRecording" class="download" download>保存录音</a></section>
    <p class="offline-note"><button id="offlineDownload">下载离线版</button> · 录音留在本次打开中，保存后可长期保留</p>
  </main>
  <nav id="nav" class="nav" aria-label="主要功能"><button class="active" data-tab="play"><span>◉</span>演奏</button><button data-tab="practice"><span>♩</span>跟谱</button><button data-tab="record"><span>●</span>录音</button></nav>

  function ensureEngine(){if(engine)return engine;var AC=window.AudioContext||window.webkitAudioContext;if(!AC){showError('此浏览器暂不支持实时音频。');return null}var ctx=new AC(),master=ctx.createGain(),dest=ctx.createMediaStreamDestination();master.gain.value=state.volume;master.connect(ctx.destination);master.connect(dest);engine={context:ctx,master:master,dest:dest};return engine}
  function showError(t){$('audioError').textContent=t;$('audioError').classList.remove('hidden')}
  function strike(i,advance){if(advance===undefined)advance=true;var e=ensureEngine();if(!e)return;e.context.resume();e.master.gain.setTargetAtTime(state.volume,e.context.currentTime,.02);var now=e.context.currentTime,base=freqs()[i],env=e.context.createGain(),filter=e.context.createBiquadFilter();filter.type='lowpass';filter.frequency.value=Math.min(6000,base*12);env.gain.setValueAtTime(.0001,now);env.gain.exponentialRampToValueAtTime(.72,now+.008);env.gain.exponentialRampToValueAtTime(.0001,now+3.4);filter.connect(env);env.connect(e.master);[[1,.72,'sine'],[2.01,.17,'sine'],[2.97,.08,'triangle'],[4.18,.035,'sine']].forEach(function(p){var o=e.context.createOscillator(),g=e.context.createGain();o.type=p[2];o.frequency.value=base*p[0];o.detune.value=(Math.random()-.5)*3;g.gain.value=p[1];o.connect(g);g.connect(filter);o.start(now);o.stop(now+3.5)});state.active=i;renderTongues();clearTimeout(activeTimer);activeTimer=setTimeout(function(){state.active=null;renderTongues()},260);if(navigator.vibrate)navigator.vibrate(9);if(advance&&state.tab==='practice'){var s=currentScore();if(i===s.notes[state.step]){state.wrong=null;state.step=state.step+1>=s.notes.length?0:state.step+1}else{state.wrong=i;setTimeout(function(){state.wrong=null;renderTongues()},280)}renderPractice();renderTongues()}}
  function renderTongues(){document.querySelectorAll('.tongue').forEach(function(b){var i=+b.dataset.i;b.classList.toggle('active',i===state.active);b.classList.toggle('wrong',i===state.wrong);b.classList.toggle('expected',state.tab==='practice'&&i===currentScore().notes[state.step])})}
  function buildDrum(){positions.forEach(function(p,i){var d=degree(i),b=document.createElement('button');b.className='tongue'+(i===0?' center':'');b.dataset.i=i;b.style.left=p[0]+'%';b.style.top=p[1]+'%';b.style.transform='translate(-50%,-50%) rotate('+p[2]+'deg)';b.setAttribute('aria-label',noteName(i)+'，简谱 '+d.n+(d.o?'，'+d.o+'音':''));b.innerHTML='<span class="degree" style="transform:rotate('+(-p[2])+'deg)">'+d.n+'</span>'+(d.o?'<small style="transform:rotate('+(-p[2])+'deg)">'+d.o+'</small>':'');b.addEventListener('pointerdown',function(e){e.preventDefault();strike(i)});b.addEventListener('click',function(e){if(e.detail===0)strike(i)});$('drum').appendChild(b)})}
  function renderTuning(){document.querySelectorAll('[data-tuning]').forEach(function(b){var on=b.dataset.tuning===state.tuning;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',on)});$('mark').textContent=state.tuning;$('tuningLabel').textContent=state.tuning+' 调 · 15 音';document.querySelectorAll('.tongue').forEach(function(b){var i=+b.dataset.i,d=degree(i);b.setAttribute('aria-label',noteName(i)+'，简谱 '+d.n+(d.o?'，'+d.o+'音':''))})}
  function renderColor(){$('drum').style.setProperty('--drum',state.color);$('colorDot').style.backgroundColor=state.color;$('colorInput').value=state.color;document.querySelectorAll('#presets button').forEach(function(b){b.classList.toggle('selected',b.dataset.color===state.color)})}
  function renderPractice(){var s=currentScore();$('scoreDetail').textContent=s.detail+' · '+s.notes.length+' 音';var line=$('scoreLine');line.innerHTML='';s.notes.forEach(function(n,i){var sec=(s.sections||[]).find(function(x){return x.at===i});if(sec){var lab=document.createElement('span');lab.className='section-label';lab.textContent=sec.label;line.appendChild(lab)}var d=degree(n),cell=document.createElement('span'),beat=(s.beats||[])[i]||1;cell.className='score-note'+(i===state.step?' current':i<state.step?' done':'');cell.setAttribute('aria-label','简谱 '+d.n+(d.o?'，'+d.o+'音':'')+'，'+beat+' 拍');cell.innerHTML=(d.o==='低'?'<small class="octave low">•</small>':'')+d.n+(d.o==='高'?'<small class="octave high">•</small>':'')+(beat!==1?'<small class="beat">'+(beat===.5?'½':beat===1.5?'1½':'2')+'</small>':'');line.appendChild(cell)});var cur=line.querySelector('.current');if(cur)cur.scrollIntoView({block:'nearest',inline:'nearest'});$('tempoLabel').textContent=state.rate+'× · ♩='+actualTempo();$('progress').textContent=(state.step+1)+' / '+s.notes.length;$('defaultTempo').textContent='本曲默认 ♩='+(s.tempo||76);document.querySelectorAll('#tempoSteps button').forEach(function(b){b.classList.toggle('selected',+b.dataset.rate===state.rate)});renderTongues()}
  function demoTick(){if(!state.demo)return;var s=currentScore(),n=s.notes[state.step];strike(n,false);var beat=(s.beats||[])[state.step]||1;demoTimer=setTimeout(function(){if(!state.demo)return;state.step++;if(state.step>=s.notes.length){state.step=0;state.demo=false;$('demo').textContent='播放示范';renderPractice()}else{renderPractice();demoTick()}},Math.round(60000/actualTempo()*beat))}
  function stopDemo(){state.demo=false;clearTimeout(demoTimer);$('demo').textContent='播放示范'}
  function setTab(tab){state.tab=tab;stopDemo();$('intro').classList.toggle('hidden',tab!=='play');$('practice').classList.toggle('hidden',tab!=='practice');$('record').classList.toggle('hidden',tab!=='record');$('coach').classList.toggle('hidden',tab!=='practice');document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab)});renderTongues();if(tab==='practice')renderPractice()}
  function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
  function startRecording(){var e=ensureEngine();if(!e||typeof MediaRecorder==='undefined'){showError('此浏览器暂不支持录音。');return}if(state.recordingUrl)URL.revokeObjectURL(state.recordingUrl);state.recordingUrl=null;$('take').classList.add('hidden');chunks=[];state.seconds=0;recorder=new MediaRecorder(e.dest.stream);recorder.ondataavailable=function(ev){if(ev.data.size)chunks.push(ev.data)};recorder.onstop=function(){var type=recorder.mimeType||'audio/webm',blob=new Blob(chunks,{type:type});state.recordingUrl=URL.createObjectURL(blob);$('player').src=state.recordingUrl;$('saveRecording').href=state.recordingUrl;$('saveRecording').download='空灵鼓-'+new Date().toISOString().slice(0,10)+(type.indexOf('ogg')>-1?'.ogg':'.webm');$('take').classList.remove('hidden');$('recordState').textContent='录音已完成'};recorder.start();state.recording=true;$('recordDot').classList.add('live');$('recordState').textContent='正在录音';$('recordBtn').textContent='停止';$('recordBtn').classList.add('stop');$('timer').textContent='00:00';recordTimer=setInterval(function(){state.seconds++;$('timer').textContent=fmt(state.seconds)},1000)}
  function stopRecording(){if(recorder&&recorder.state==='recording')recorder.stop();state.recording=false;clearInterval(recordTimer);$('recordDot').classList.remove('live');$('recordBtn').textContent='开始录音';$('recordBtn').classList.remove('stop')}
  function init(){buildDrum();colors.forEach(function(c){var b=document.createElement('button');b.dataset.color=c[1];b.innerHTML='<span style="background:'+c[1]+'"></span><small>'+c[0]+'</small>';b.setAttribute('aria-label','鼓面颜色：'+c[0]);b.addEventListener('click',function(){state.color=c[1];renderColor()});$('presets').appendChild(b)});var sel=$('scoreSelect'),classic=document.createElement('optgroup'),ex=document.createElement('optgroup');classic.label='经典旋律';ex.label='基础练习';scores.forEach(function(s){var o=document.createElement('option');o.value=s.id;o.textContent=s.title;(s.kind==='classic'?classic:ex).appendChild(o)});sel.appendChild(classic);sel.appendChild(ex);sel.value=state.scoreId;[.5,.75,1,1.25,1.5].forEach(function(r){var b=document.createElement('button');b.dataset.rate=r;b.textContent=r+'×';b.addEventListener('click',function(){state.rate=r;renderPractice();if(state.demo){clearTimeout(demoTimer);demoTick()}});$('tempoSteps').appendChild(b)});renderColor();renderTuning();renderPractice()}
  document.querySelectorAll('[data-tuning]').forEach(function(b){b.addEventListener('click',function(){state.tuning=b.dataset.tuning;renderTuning()})});$('volume').addEventListener('input',function(){state.volume=+$('volume').value;if(engine)engine.master.gain.setTargetAtTime(state.volume,engine.context.currentTime,.02)});$('colorTrigger').addEventListener('click',function(){var p=$('colorPanel'),open=p.classList.toggle('hidden')===false;$('colorTrigger').setAttribute('aria-expanded',open)});$('colorInput').addEventListener('input',function(){state.color=this.value;renderColor()});document.addEventListener('pointerdown',function(e){if(!e.target.closest('.finish')){$('colorPanel').classList.add('hidden');$('colorTrigger').setAttribute('aria-expanded','false')}});$('scoreSelect').addEventListener('change',function(){state.scoreId=this.value;state.step=0;state.rate=1;stopDemo();renderPractice()});$('demo').addEventListener('click',function(){state.demo=!state.demo;this.textContent=state.demo?'暂停示范':'播放示范';clearTimeout(demoTimer);if(state.demo)demoTick()});$('restart').addEventListener('click',function(){state.step=0;stopDemo();renderPractice()});$('recordBtn').addEventListener('click',function(){state.recording?stopRecording():startRecording()});document.querySelectorAll('[data-tab]').forEach(function(b){b.addEventListener('click',function(){setTab(b.dataset.tab)})});$('offlineDownload').addEventListener('click',function(){var html='<!doctype html>\n'+document.documentElement.outerHTML.replace(/<audio id="player"[^>]*src="blob:[^"]*"/,'<audio id="player"');var blob=new Blob([html],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='空灵鼓-离线版.html';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)});init();
})();
